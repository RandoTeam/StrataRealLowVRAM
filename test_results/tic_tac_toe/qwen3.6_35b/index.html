<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-Нолики — Qwen3.6-35B-A3B Edition</title>
    <style>
        :root {
            --bg: #091512;
            --surface: rgba(16, 37, 32, 0.7);
            --border: rgba(52, 211, 153, 0.2);
            --text: #ecfdf5;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --x-color: #34d399;
            --o-color: #f59e0b;
            --muted: #6ee7b7;
            --cell-bg: rgba(6, 78, 59, 0.25);
            --cell-hover: rgba(6, 78, 59, 0.5);
            --win-glow: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 50% 10%, #064e3b 0%, var(--bg) 85%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.2rem;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #34d399, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .header p {
            color: #a7f3d0;
            font-size: 0.9rem;
            opacity: 0.85;
        }

        .container {
            max-width: 440px;
            width: 100%;
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 26px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(16, 185, 129, 0.1);
        }

        .controls {
            display: flex;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
        }

        .controls button {
            flex: 1;
            padding: 9px 12px;
            background: transparent;
            border: none;
            color: #a7f3d0;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .controls button.active {
            background: var(--accent);
            color: #064e3b;
            font-weight: 700;
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 18px;
            border: 1px solid rgba(52, 211, 153, 0.15);
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .lbl {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #6ee7b7;
        }

        .stat-item .val {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 2px;
        }

        .stat-item.x .val { color: var(--x-color); }
        .stat-item.o .val { color: var(--o-color); }
        .stat-item.tie .val { color: #94a3b8; }

        .status-box {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 18px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-box span.x { color: var(--x-color); text-shadow: 0 0 8px var(--accent-glow); }
        .status-box span.o { color: var(--o-color); text-shadow: 0 0 8px rgba(245, 158, 11, 0.4); }
        .status-box span.win { color: var(--win-glow); text-shadow: 0 0 12px rgba(251, 191, 36, 0.6); }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 22px;
            aspect-ratio: 1;
        }

        .cell {
            aspect-ratio: 1;
            background: var(--cell-bg);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cell:hover:not(.taken) {
            background: var(--cell-hover);
            border-color: #34d399;
            transform: translateY(-2px);
        }

        .cell.x {
            color: var(--x-color);
            text-shadow: 0 0 16px rgba(52, 211, 153, 0.6);
        }

        .cell.o {
            color: var(--o-color);
            text-shadow: 0 0 16px rgba(245, 158, 11, 0.6);
        }

        .cell.winning {
            background: rgba(251, 191, 36, 0.2) !important;
            border-color: var(--win-glow) !important;
            color: var(--win-glow) !important;
            text-shadow: 0 0 24px var(--win-glow) !important;
            transform: scale(1.04);
        }

        .action-row {
            display: flex;
            gap: 10px;
        }

        .btn-act {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            border: none;
        }

        .btn-act.primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .btn-act.primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn-act.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: #a7f3d0;
        }

        .btn-act.secondary:hover {
            background: rgba(52, 211, 153, 0.1);
        }

        .footer {
            margin-top: 16px;
            color: #6ee7b7;
            font-size: 0.8rem;
            text-align: center;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>КРЕСТИКИ-НОЛИКИ</h1>
        <p>Qwen3.6-35B-A3B Uncensored • High Speed MoE (25+ tok/s)</p>
    </div>

    <div class="container">
        <div class="controls">
            <button id="mode-ai" class="active">Против ИИ</button>
            <button id="mode-pvp">2 Игрока</button>
            <button id="toggle-sound">Звук: ВКЛ</button>
        </div>

        <div class="stats-bar">
            <div class="stat-item x">
                <div class="lbl">Игрок (X)</div>
                <div class="val" id="val-x">0</div>
            </div>
            <div class="stat-item tie">
                <div class="lbl">Ничьи</div>
                <div class="val" id="val-tie">0</div>
            </div>
            <div class="stat-item o">
                <div class="lbl" id="lbl-o">ИИ (O)</div>
                <div class="val" id="val-o">0</div>
            </div>
        </div>

        <div class="status-box" id="status-box">Ход: <span class="x">X</span></div>

        <div class="board" id="board">
            <div class="cell" data-idx="0"></div>
            <div class="cell" data-idx="1"></div>
            <div class="cell" data-idx="2"></div>
            <div class="cell" data-idx="3"></div>
            <div class="cell" data-idx="4"></div>
            <div class="cell" data-idx="5"></div>
            <div class="cell" data-idx="6"></div>
            <div class="cell" data-idx="7"></div>
            <div class="cell" data-idx="8"></div>
        </div>

        <div class="action-row">
            <button class="btn-act primary" id="btn-next">Новый раунд</button>
            <button class="btn-act secondary" id="btn-undo">Шаг назад</button>
            <button class="btn-act secondary" id="btn-reset">Сброс</button>
        </div>
    </div>

    <div class="footer">
        DeepSeek Harness Integration • 3B Active Parameters • Low VRAM
    </div>

    <script>
        const WINS = [
            [0,1,2],[3,4,5],[6,7,8],
            [0,3,6],[1,4,7],[2,5,8],
            [0,4,8],[2,4,6]
        ];

        let state = Array(9).fill('');
        let history = [];
        let curPlayer = 'X';
        let gameOver = false;
        let aiMode = true;
        let soundOn = true;
        let score = { x: 0, o: 0, ties: 0 };

        const cells = document.querySelectorAll('.cell');
        const statusEl = document.getElementById('status-box');
        const valX = document.getElementById('val-x');
        const valO = document.getElementById('val-o');
        const valTie = document.getElementById('val-tie');
        const lblO = document.getElementById('lbl-o');
        const modeAiBtn = document.getElementById('mode-ai');
        const modePvpBtn = document.getElementById('mode-pvp');
        const soundBtn = document.getElementById('toggle-sound');
        const nextBtn = document.getElementById('btn-next');
        const undoBtn = document.getElementById('btn-undo');
        const resetBtn = document.getElementById('btn-reset');

        // Web Audio synth blips
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            if (!soundOn || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function checkWin(grid) {
            for (let [a, b, c] of WINS) {
                if (grid[a] && grid[a] === grid[b] && grid[a] === grid[c]) {
                    return { winner: grid[a], line: [a, b, c] };
                }
            }
            if (grid.every(c => c !== '')) return { winner: 'tie', line: [] };
            return null;
        }

        function clickHandler(e) {
            const idx = parseInt(e.target.dataset.idx);
            if (state[idx] !== '' || gameOver) return;

            makeMove(idx, curPlayer);
            playTone(curPlayer === 'X' ? 440 : 330, 'sine', 0.1);

            const outcome = checkWin(state);
            if (outcome) { handleEnd(outcome); return; }

            curPlayer = curPlayer === 'X' ? 'O' : 'X';
            updateUI();

            if (aiMode && curPlayer === 'O' && !gameOver) {
                setTimeout(runAi, 180);
            }
        }

        function makeMove(idx, p) {
            state[idx] = p;
            history.push({ idx, p });
            cells[idx].textContent = p;
            cells[idx].classList.add('taken', p.toLowerCase());
        }

        function runAi() {
            if (gameOver) return;

            // 1. Win if possible
            for (let i = 0; i < 9; i++) {
                if (state[i] === '') {
                    state[i] = 'O';
                    if (checkWin(state)?.winner === 'O') {
                        state[i] = ''; makeMove(i, 'O'); checkAfterAi(); return;
                    }
                    state[i] = '';
                }
            }
            // 2. Block user
            for (let i = 0; i < 9; i++) {
                if (state[i] === '') {
                    state[i] = 'X';
                    if (checkWin(state)?.winner === 'X') {
                        state[i] = ''; makeMove(i, 'O'); checkAfterAi(); return;
                    }
                    state[i] = '';
                }
            }
            // 3. Center
            if (state[4] === '') { makeMove(4, 'O'); checkAfterAi(); return; }

            // 4. Random free
            const free = state.map((v, idx) => v === '' ? idx : null).filter(v => v !== null);
            if (free.length > 0) {
                const choice = free[Math.floor(Math.random() * free.length)];
                makeMove(choice, 'O');
                checkAfterAi();
            }
        }

        function checkAfterAi() {
            playTone(330, 'sine', 0.1);
            const res = checkWin(state);
            if (res) handleEnd(res);
            else { curPlayer = 'X'; updateUI(); }
        }

        function handleEnd(res) {
            gameOver = true;
            if (res.winner === 'tie') {
                statusEl.innerHTML = '<span class="win">Ничья! 🤝</span>';
                score.ties++;
                valTie.textContent = score.ties;
                playTone(220, 'triangle', 0.25);
            } else {
                res.line.forEach(i => cells[i].classList.add('winning'));
                const title = res.winner === 'X' ? 'Победа X!' : (aiMode ? 'ИИ победил!' : 'Победа O!');
                statusEl.innerHTML = `<span class="win">${title} 🎉</span>`;
                playTone(587.33, 'triangle', 0.35);
                setTimeout(() => playTone(880, 'triangle', 0.4), 150);
                if (res.winner === 'X') { score.x++; valX.textContent = score.x; }
                else { score.o++; valO.textContent = score.o; }
            }
        }

        function updateUI() {
            if (gameOver) return;
            statusEl.innerHTML = `Ход: <span class="${curPlayer.toLowerCase()}">${curPlayer}</span>`;
        }

        function newRound() {
            state = Array(9).fill('');
            history = [];
            gameOver = false;
            curPlayer = 'X';
            cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
            updateUI();
        }

        function undoMove() {
            if (gameOver || history.length === 0) return;
            const steps = (aiMode && history.length >= 2) ? 2 : 1;
            for (let i = 0; i < steps; i++) {
                const last = history.pop();
                if (last) {
                    state[last.idx] = '';
                    cells[last.idx].textContent = '';
                    cells[last.idx].className = 'cell';
                }
            }
            curPlayer = 'X';
            updateUI();
        }

        cells.forEach(c => c.addEventListener('click', clickHandler));
        nextBtn.addEventListener('click', newRound);
        undoBtn.addEventListener('click', undoMove);
        resetBtn.addEventListener('click', () => {
            score = { x: 0, o: 0, ties: 0 };
            valX.textContent = '0'; valO.textContent = '0'; valTie.textContent = '0';
            newRound();
        });

        modeAiBtn.addEventListener('click', () => {
            aiMode = true;
            modeAiBtn.classList.add('active');
            modePvpBtn.classList.remove('active');
            lblO.textContent = 'ИИ (O)';
            newRound();
        });

        modePvpBtn.addEventListener('click', () => {
            aiMode = false;
            modePvpBtn.classList.add('active');
            modeAiBtn.classList.remove('active');
            lblO.textContent = 'Игрок 2 (O)';
            newRound();
        });

        soundBtn.addEventListener('click', () => {
            soundOn = !soundOn;
            soundBtn.textContent = soundOn ? 'Звук: ВКЛ' : 'Звук: ВЫКЛ';
        });

        updateUI();
    </script>
</body>
</html>
