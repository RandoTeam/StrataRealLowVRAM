<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen3.6 Tic-Tac-Toe AI Arena</title>
    <style>
        :root {
            --bg-primary: #0a0d14;
            --bg-card: #121826;
            --accent-cyan: #00f2fe;
            --accent-purple: #9d4edd;
            --accent-gold: #ffb703;
            --text-main: #f8f9fa;
            --text-dim: #94a3b8;
            --cell-bg: #1a2236;
            --cell-hover: #222d47;
            --border-glow: rgba(0, 242, 254, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 50% 20%, #151d30 0%, #0a0d14 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .arena-container {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px var(--border-glow);
            text-align: center;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 24px;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .score-label {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-val {
            font-size: 20px;
            font-weight: bold;
        }

        .score-x .score-val { color: var(--accent-cyan); }
        .score-o .score-val { color: var(--accent-purple); }
        .score-ties .score-val { color: var(--accent-gold); }

        .game-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .btn-mode {
            padding: 8px 16px;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .btn-mode.active {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(157, 78, 221, 0.2));
            color: var(--text-main);
            border-color: var(--accent-cyan);
        }

        .status-msg {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 18px;
            min-height: 24px;
            color: var(--accent-cyan);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .cell {
            aspect-ratio: 1;
            background: var(--cell-bg);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .cell:hover:not(.taken) {
            background: var(--cell-hover);
            transform: scale(1.03);
            border-color: var(--border-glow);
        }

        .cell.x {
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }

        .cell.o {
            color: var(--accent-purple);
            text-shadow: 0 0 15px rgba(157, 78, 221, 0.6);
        }

        .cell.win {
            background: rgba(255, 183, 3, 0.2);
            border-color: var(--accent-gold);
            animation: pulse-win 1s infinite alternate;
        }

        @keyframes pulse-win {
            from { box-shadow: 0 0 10px rgba(255, 183, 3, 0.4); }
            to { box-shadow: 0 0 25px rgba(255, 183, 3, 0.8); }
        }

        .btn-reset {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border: none;
            color: #050811;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }
    </style>
</head>
<body>
    <div class="arena-container">
        <h1>Tic-Tac-Toe AI Arena</h1>
        <p class="subtitle">Generated by Qwen3.6-35B-A3B Uncensored (MoE 256 Experts)</p>

        <div class="scoreboard">
            <div class="score-item score-x">
                <span class="score-label">Player X</span>
                <span class="score-val" id="scoreX">0</span>
            </div>
            <div class="score-item score-ties">
                <span class="score-label">Draws</span>
                <span class="score-val" id="scoreTies">0</span>
            </div>
            <div class="score-item score-o">
                <span class="score-label">Player O</span>
                <span class="score-val" id="scoreO">0</span>
            </div>
        </div>

        <div class="game-controls">
            <button class="btn-mode active" id="modeAi" onclick="setMode('ai')">vs Minimax AI</button>
            <button class="btn-mode" id="mode2p" onclick="setMode('2p')">2 Players</button>
        </div>

        <div class="status-msg" id="statusMsg">Player X's Turn</div>

        <div class="grid" id="grid">
            <div class="cell" onclick="handleMove(0)"></div>
            <div class="cell" onclick="handleMove(1)"></div>
            <div class="cell" onclick="handleMove(2)"></div>
            <div class="cell" onclick="handleMove(3)"></div>
            <div class="cell" onclick="handleMove(4)"></div>
            <div class="cell" onclick="handleMove(5)"></div>
            <div class="cell" onclick="handleMove(6)"></div>
            <div class="cell" onclick="handleMove(7)"></div>
            <div class="cell" onclick="handleMove(8)"></div>
        </div>

        <button class="btn-reset" onclick="resetGame()">New Match</button>
    </div>

    <script>
        let board = Array(9).fill('');
        let currentPlayer = 'X';
        let gameOver = false;
        let mode = 'ai'; // 'ai' or '2p'
        let scores = { X: 0, O: 0, ties: 0 };

        const winLines = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function setMode(m) {
            mode = m;
            document.getElementById('modeAi').classList.toggle('active', m === 'ai');
            document.getElementById('mode2p').classList.toggle('active', m === '2p');
            resetGame();
        }

        function checkWin(b, p) {
            for (const line of winLines) {
                if (b[line[0]] === p && b[line[1]] === p && b[line[2]] === p) {
                    return line;
                }
            }
            return null;
        }

        function isDraw(b) {
            return b.every(cell => cell !== '') && !checkWin(b, 'X') && !checkWin(b, 'O');
        }

        function minimax(newBoard, player) {
            const availSpots = newBoard.map((v, i) => v === '' ? i : null).filter(v => v !== null);

            if (checkWin(newBoard, 'X')) return { score: -10 };
            if (checkWin(newBoard, 'O')) return { score: 10 };
            if (availSpots.length === 0) return { score: 0 };

            const moves = [];
            for (let i = 0; i < availSpots.length; i++) {
                const move = {};
                move.index = availSpots[i];
                newBoard[availSpots[i]] = player;

                if (player === 'O') {
                    const result = minimax(newBoard, 'X');
                    move.score = result.score;
                } else {
                    const result = minimax(newBoard, 'O');
                    move.score = result.score;
                }

                newBoard[availSpots[i]] = '';
                moves.push(move);
            }

            let bestMove;
            if (player === 'O') {
                let bestScore = -10000;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score > bestScore) {
                        bestScore = moves[i].score;
                        bestMove = i;
                    }
                }
            } else {
                let bestScore = 10000;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score < bestScore) {
                        bestScore = moves[i].score;
                        bestMove = i;
                    }
                }
            }
            return moves[bestMove];
        }

        function handleMove(idx) {
            if (board[idx] !== '' || gameOver) return;

            makeMove(idx, currentPlayer);

            if (!gameOver && mode === 'ai' && currentPlayer === 'O') {
                setTimeout(() => {
                    if (gameOver) return;
                    const best = minimax(board, 'O');
                    if (best && best.index !== undefined) {
                        makeMove(best.index, 'O');
                    }
                }, 180);
            }
        }

        function makeMove(idx, player) {
            board[idx] = player;
            const cells = document.querySelectorAll('.cell');
            cells[idx].innerText = player;
            cells[idx].classList.add(player.toLowerCase(), 'taken');

            const win = checkWin(board, player);
            if (win) {
                gameOver = true;
                win.forEach(i => cells[i].classList.add('win'));
                document.getElementById('statusMsg').innerText = `Player ${player} Wins!`;
                scores[player]++;
                updateScores();
                return;
            }

            if (isDraw(board)) {
                gameOver = true;
                document.getElementById('statusMsg').innerText = "It's a Draw!";
                scores.ties++;
                updateScores();
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            document.getElementById('statusMsg').innerText = `Player ${currentPlayer}'s Turn`;
        }

        function updateScores() {
            document.getElementById('scoreX').innerText = scores.X;
            document.getElementById('scoreO').innerText = scores.O;
            document.getElementById('scoreTies').innerText = scores.ties;
        }

        function resetGame() {
            board = Array(9).fill('');
            currentPlayer = 'X';
            gameOver = false;
            document.querySelectorAll('.cell').forEach(c => {
                c.innerText = '';
                c.className = 'cell';
            });
            document.getElementById('statusMsg').innerText = "Player X's Turn";
        }
    </script>
</body>
</html>
