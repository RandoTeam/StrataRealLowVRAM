<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-Нолики — Qwen3.8 Coder Edition</title>
    <style>
        :root {
            --bg: #0b0e14;
            --panel: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.12);
            --text: #eaf0fa;
            --muted: #8c9bb2;
            --x-color: #00e5ff;
            --o-color: #ff5c8a;
            --win-color: #ffd166;
            --accent: #22d8ff;
            --btn-bg: #1c2333;
            --btn-hover: #2a354c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #151d2f 0%, var(--bg) 80%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.2rem;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--x-color), var(--o-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .card {
            background: var(--panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
        }

        .mode-toggle {
            display: flex;
            background: #06080d;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            width: 100%;
        }

        .mode-toggle button {
            flex: 1;
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-toggle button.active {
            background: var(--btn-hover);
            color: var(--text);
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 18px;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .score-item {
            text-align: center;
        }

        .score-item .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
        }

        .score-item .val {
            font-size: 1.4rem;
            font-weight: 700;
            margin-top: 2px;
        }

        .score-item.x .val { color: var(--x-color); }
        .score-item.o .val { color: var(--o-color); }
        .score-item.tie .val { color: var(--muted); }

        .status {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .status span.x { color: var(--x-color); }
        .status span.o { color: var(--o-color); }
        .status span.win { color: var(--win-color); text-shadow: 0 0 10px rgba(255, 209, 102, 0.4); }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            aspect-ratio: 1;
            margin-bottom: 22px;
        }

        .cell {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cell:hover:not(.taken) {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .cell.x {
            color: var(--x-color);
            text-shadow: 0 0 14px rgba(0, 229, 255, 0.5);
        }

        .cell.o {
            color: var(--o-color);
            text-shadow: 0 0 14px rgba(255, 92, 138, 0.5);
        }

        .cell.winning {
            background: rgba(255, 209, 102, 0.15) !important;
            border-color: var(--win-color) !important;
            color: var(--win-color) !important;
            text-shadow: 0 0 20px var(--win-color) !important;
            transform: scale(1.04);
        }

        .actions {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--btn-bg);
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn:hover {
            background: var(--btn-hover);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .btn.primary {
            background: linear-gradient(135deg, #0088cc, #00b4d8);
            border: none;
            color: #fff;
        }

        .btn.primary:hover {
            opacity: 0.95;
            box-shadow: 0 4px 14px rgba(0, 180, 216, 0.4);
        }

        .footer {
            margin-top: 18px;
            color: var(--muted);
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>КРЕСТИКИ-НОЛИКИ</h1>
        <p>Qwen3.8 Coder IQ1_M Benchmark Model</p>
    </div>

    <div class="card">
        <div class="mode-toggle">
            <button id="mode-pve" class="active">Против ИИ</button>
            <button id="mode-pvp">2 Игрока</button>
        </div>

        <div class="scoreboard">
            <div class="score-item x">
                <div class="label">Игрок (X)</div>
                <div class="val" id="score-x">0</div>
            </div>
            <div class="score-item tie">
                <div class="label">Ничьи</div>
                <div class="val" id="score-tie">0</div>
            </div>
            <div class="score-item o">
                <div class="label" id="label-o">ИИ (O)</div>
                <div class="val" id="score-o">0</div>
            </div>
        </div>

        <div class="status" id="status-text">Ход игрока <span class="x">X</span></div>

        <div class="board" id="board">
            <div class="cell" data-idx="0"></div>
            <div class="cell" data-idx="1"></div>
            <div class="cell" data-idx="2"></div>
            <div class="cell" data-idx="3"></div>
            <div class="cell" data-idx="4"></div>
            <div class="cell" data-idx="5"></div>
            <div class="cell" data-idx="6"></div>
            <div class="cell" data-idx="7"></div>
            <div class="cell" data-idx="8"></div>
        </div>

        <div class="actions">
            <button class="btn primary" id="btn-restart">Новый раунд</button>
            <button class="btn" id="btn-reset-score">Сброс счета</button>
        </div>
    </div>

    <div class="footer">
        Strata LowVRAM Edition • RTX 3050 Laptop • Контекст 65K
    </div>

    <script>
        const WIN_PATTERNS = [
            [0,1,2], [3,4,5], [6,7,8], // Rows
            [0,3,6], [1,4,7], [2,5,8], // Cols
            [0,4,8], [2,4,6]           // Diagonals
        ];

        let boardState = Array(9).fill('');
        let currentPlayer = 'X';
        let isGameOver = false;
        let isAiMode = true;
        let scores = { X: 0, O: 0, ties: 0 };

        const boardEl = document.getElementById('board');
        const cells = document.querySelectorAll('.cell');
        const statusEl = document.getElementById('status-text');
        const scoreXEl = document.getElementById('score-x');
        const scoreOEl = document.getElementById('score-o');
        const scoreTieEl = document.getElementById('score-tie');
        const labelOEl = document.getElementById('label-o');
        const modePveBtn = document.getElementById('mode-pve');
        const modePvpBtn = document.getElementById('mode-pvp');
        const restartBtn = document.getElementById('btn-restart');
        const resetScoreBtn = document.getElementById('btn-reset-score');

        function checkWinner(state) {
            for (let [a, b, c] of WIN_PATTERNS) {
                if (state[a] && state[a] === state[b] && state[a] === state[c]) {
                    return { winner: state[a], line: [a, b, c] };
                }
            }
            if (state.every(cell => cell !== '')) {
                return { winner: 'tie', line: [] };
            }
            return null;
        }

        function updateStatus() {
            if (isGameOver) return;
            const cls = currentPlayer.toLowerCase();
            statusEl.innerHTML = `Ход: <span class="${cls}">${currentPlayer}</span>`;
        }

        function handleCellClick(e) {
            const idx = parseInt(e.target.dataset.idx);
            if (boardState[idx] !== '' || isGameOver) return;

            makeMove(idx, currentPlayer);

            const result = checkWinner(boardState);
            if (result) {
                endGame(result);
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateStatus();

            if (isAiMode && currentPlayer === 'O' && !isGameOver) {
                setTimeout(makeAiMove, 250);
            }
        }

        function makeMove(idx, player) {
            boardState[idx] = player;
            const cell = cells[idx];
            cell.textContent = player;
            cell.classList.add('taken', player.toLowerCase());
        }

        function makeAiMove() {
            if (isGameOver) return;

            // 1. Check if AI can win immediately
            for (let i = 0; i < 9; i++) {
                if (boardState[i] === '') {
                    boardState[i] = 'O';
                    if (checkWinner(boardState)?.winner === 'O') {
                        boardState[i] = '';
                        makeMove(i, 'O');
                        checkGameOutcome();
                        return;
                    }
                    boardState[i] = '';
                }
            }

            // 2. Block player's win
            for (let i = 0; i < 9; i++) {
                if (boardState[i] === '') {
                    boardState[i] = 'X';
                    if (checkWinner(boardState)?.winner === 'X') {
                        boardState[i] = '';
                        makeMove(i, 'O');
                        checkGameOutcome();
                        return;
                    }
                    boardState[i] = '';
                }
            }

            // 3. Take center if free
            if (boardState[4] === '') {
                makeMove(4, 'O');
                checkGameOutcome();
                return;
            }

            // 4. Take random available corner/edge
            const emptyIdxs = boardState.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
            if (emptyIdxs.length > 0) {
                const choice = emptyIdxs[Math.floor(Math.random() * emptyIdxs.length)];
                makeMove(choice, 'O');
                checkGameOutcome();
            }
        }

        function checkGameOutcome() {
            const result = checkWinner(boardState);
            if (result) {
                endGame(result);
            } else {
                currentPlayer = 'X';
                updateStatus();
            }
        }

        function endGame(result) {
            isGameOver = true;
            if (result.winner === 'tie') {
                statusEl.innerHTML = '<span class="win">Ничья!</span>';
                scores.ties++;
                scoreTieEl.textContent = scores.ties;
            } else {
                result.line.forEach(idx => cells[idx].classList.add('winning'));
                const who = result.winner === 'X' ? 'X победил!' : (isAiMode ? 'ИИ победил!' : 'O победил!');
                statusEl.innerHTML = `<span class="win">${who} 🎉</span>`;
                scores[result.winner]++;
                if (result.winner === 'X') scoreXEl.textContent = scores.X;
                else scoreOEl.textContent = scores.O;
            }
        }

        function restartRound() {
            boardState = Array(9).fill('');
            isGameOver = false;
            currentPlayer = 'X';
            cells.forEach(c => {
                c.textContent = '';
                c.className = 'cell';
            });
            updateStatus();
        }

        function setMode(ai) {
            isAiMode = ai;
            modePveBtn.classList.toggle('active', ai);
            modePvpBtn.classList.toggle('active', !ai);
            labelOEl.textContent = ai ? 'ИИ (O)' : 'Игрок 2 (O)';
            restartRound();
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        restartBtn.addEventListener('click', restartRound);
        resetScoreBtn.addEventListener('click', () => {
            scores = { X: 0, O: 0, ties: 0 };
            scoreXEl.textContent = '0';
            scoreOEl.textContent = '0';
            scoreTieEl.textContent = '0';
            restartRound();
        });

        modePveBtn.addEventListener('click', () => setMode(true));
        modePvpBtn.addEventListener('click', () => setMode(false));

        updateStatus();
    </script>
</body>
</html>
